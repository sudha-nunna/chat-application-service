services:
  - type: web
    name: chat-application-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: F5_TTS_URL
        sync: false
      - key: VOICE_ENGINE_URL
        sync: false
      - key: ENABLE_EDGE_FALLBACK
        value: "true"
